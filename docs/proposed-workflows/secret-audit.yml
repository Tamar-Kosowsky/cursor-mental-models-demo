name: Secrets & Workflow Audit

on:
  schedule:
    # Weekly (Sun) at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

# Least privilege by default. This workflow is read-only and should not
# write to the repo or interact with PRs.
permissions:
  contents: read

jobs:
  audit:
    name: Gitleaks + actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        with:
          # Optional allowlist config (kept small; extends default rules).
          config-path: .gitleaks.toml
          args: --redact

      - name: Lint workflows (actionlint)
        uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62 # v1.7.9

