<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Mental Models – AI Terms Dictionary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Cursor Mental Models</h1>
        <p class="subtitle">AI Terms Dictionary</p>
    </header>

    <main>
        <div class="search-container">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search mental models..."
                aria-label="Search mental models"
            >
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>

        <div id="cards-container" class="cards-grid"></div>

        <div id="no-results" class="no-results" style="display: none;">
            <p>No results found. Try a different search term.</p>
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay" style="display: none;" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-content">
            <button id="modal-close" class="modal-close" aria-label="Close modal">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
