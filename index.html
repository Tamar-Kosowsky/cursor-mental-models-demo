<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Mental Models – AI Terms Dictionary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Cursor Mental Models</h1>
        <p class="subtitle">AI Terms Dictionary</p>
    </header>

    <main>
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search mental models..." 
                aria-label="Search mental models"
            >
        </div>

        <div id="cardsContainer" class="cards-grid">
            <!-- Cards will be dynamically inserted here -->
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </main>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="modalClose" class="modal-close" aria-label="Close modal">&times;</button>
            <div id="modalBody">
                <!-- Modal content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
